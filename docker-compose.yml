services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

  app:
    build: .
    environment:
      REDIS_HOST: redis
    depends_on: [redis]
    deploy:
      replicas: 3

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [app]

volumes:
  redis-data:
